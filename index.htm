<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday & A Question ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Dramatic, romantic dark crimson to midnight gradient */
            background: linear-gradient(45deg, #1a0005 0%, #590016 50%, #2b000d 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            /* Dark glassmorphism effect */
            background: rgba(30, 0, 10, 0.6);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255, 105, 135, 0.1);
            border: 1px solid rgba(255, 115, 145, 0.2);
            max-width: 550px;
            width: 85%;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }

        .container:hover {
            transform: scale(1.02);
        }

        h1 {
            color: #ffb3c6;
            font-family: 'Pacifico', cursive;
            font-size: 32px; 
            margin-bottom: 10px;
            line-height: 1.3;
            text-shadow: 0 0 15px rgba(255, 179, 198, 0.4);
        }

        .birthday-greeting {
            font-family: 'Great Vibes', cursive;
            font-size: 56px;
            color: #ffd700; /* gold */
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }

        p.subtitle {
            font-size: 18px;
            color: #ffccd5;
            margin-bottom: 25px;
            line-height: 1.6;
            font-weight: 300;
        }

        .media-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .framed-photo {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 15px;
            border: 5px solid white; /* Frame effect */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            object-fit: cover;
            object-position: center;
        }

        .gif-container img {
            width: 100%;
            max-width: 220px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 179, 198, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 14px 35px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 1px;
        }

        #yesBtn {
            background: linear-gradient(45deg, #d81b60, #ff4081);
            color: white;
            box-shadow: 0 5px 20px rgba(216, 27, 96, 0.4);
            animation: pulse 2s infinite;
        }

        #yesBtn:hover {
            background: linear-gradient(45deg, #ff4081, #ff79b0);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 64, 129, 0.6);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 5px 20px rgba(216, 27, 96, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 10px 30px rgba(216, 27, 96, 0.7); }
            100% { transform: scale(1); box-shadow: 0 5px 20px rgba(216, 27, 96, 0.4); }
        }

        #noBtn {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffccd5;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative; 
            z-index: 20;
            backdrop-filter: blur(5px);
        }

        .romantic-element {
            position: fixed;
            top: -1vh;
            font-size: 2rem;
            animation: fall linear forwards;
            z-index: 0;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1 class="birthday-greeting">Happy Birthday!</h1>
        <p class="subtitle">Wishing you a day filled with love and joy.</p>
        
        <div class="media-container">
            <!-- Framed photo from the provided link -->
            <img class="framed-photo" src="https://kommodo.ai/i/nD5iSWZzjvGBHQilo0EB" alt="Your Photo">
            
            <div class="gif-container">
                <!-- Dramatic/Romantic pleading bear GIF -->
                <img id="mainGif" src="https://media.tenor.com/T0bHhE12O6sAAAAi/milk-and-mocha-hug.gif" alt="Romantic Bear">
            </div>
        </div>

        <h1 id="question">Nusaiba, you are my ultimate source of peace and emotional comfort.</h1>
        <p id="subtitle" class="subtitle">I want to spend the rest of my life by your side. Will you be my forever partner?</p>

        <div class="btn-group">
            <button id="yesBtn">Yes, absolutely! 💍</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const subtitle = document.getElementById('subtitle');
        const mainGif = document.getElementById('mainGif');
        const btnGroup = document.querySelector('.btn-group');

        // Desperate, romantic phrases for the "No" button evasion
        const phrases = [
            "No", "Please don't break my heart 💔", "I can't imagine life without you!", "Look into my eyes...", 
            "Are you really sure?", "You are my peace!", "I'll wait for you forever.", 
            "My heart belongs to you!", "Just say yes!", "Give us a chance?", 
            "I promise to make you happy!", "Don't run away from this!", "Change of heart?", 
            "I love you too much!", "Is that your final answer?", "You're my everything 🥺"
        ];
        let phraseIndex = 0;

        noBtn.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            phraseIndex = (phraseIndex + 1) % phrases.length;
            noBtn.innerText = phrases[phraseIndex];
        });

        yesBtn.addEventListener('click', () => {
            question.innerText = "You've made me the happiest person alive!";
            question.style.fontSize = "38px"; 
            
            subtitle.innerText = "I love you, forever and always. ❤️💍";
            subtitle.style.fontSize = "22px";
            subtitle.style.color = "#fff";
            subtitle.style.fontWeight = "bold";
            
            // Romantic kiss/wedding GIF
            mainGif.src = "https://media.tenor.com/yFtoE24xUoIAAAAi/milk-and-mocha-kiss.gif"; 
            
            btnGroup.style.display = 'none';
            setInterval(createRomanticElements, 120);
        });

        const emojis = ['❤️', '🌹', '💍', '✨', '💖'];

        function createRomanticElements() {
            const element = document.createElement('div');
            element.classList.add('romantic-element');
            element.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            element.style.left = Math.random() * 100 + "vw";
            element.style.animationDuration = Math.random() * 3 + 4 + "s"; // Slower, more elegant fall
            
            // Make hearts slightly bigger
            if(element.innerText === '❤️' || element.innerText === '💖') {
                element.style.fontSize = (Math.random() * 1.5 + 1.5) + "rem";
            }
            
            document.body.appendChild(element);
            setTimeout(() => { element.remove(); }, 7000);
        }
    </script>
</body>
</html>
